---
name: inbox

services:
  inbox:
    container_name: ${MAILHOST:?}
    build:
      context: .
      target: web
    image: inbox
    hostname: ${MAILHOST:?}
    env_file:
      - .env
    ports:
      - 80:8080
    volumes:
      - ./data:/data
      - ./:/app

  server:
    build:
      context: .
      target: server
    labels:
      ansible: true
    volumes:
      - ./:/app
